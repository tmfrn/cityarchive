<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manchester City Women — Match Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    /* =========================================================
       DESIGN TOKENS
       ========================================================= */
    :root {
      /* Brand */
      --sky:           #6CABDD;
      --sky-dim:       #5a9dce;
      --sky-deep:      #2a6395;
      --sky-surface:   rgba(108,171,221,0.08);
      --sky-border:    rgba(108,171,221,0.22);
      --navy:          #1A2D4A;
      --navy-dim:      #243c60;
      --navy-surface:  rgba(26,45,74,0.06);
      --maroon:        #7b2d42;  /* from crest rose */
      --maroon-surface:rgba(123,45,66,0.08);

      /* Page */
      --bg:            #f5f4f0;
      --surface:       #ffffff;
      --surface-alt:   #fafaf7;
      --border:        #dedad2;
      --border-subtle: #eae8e2;

      /* Text */
      --text-bright:   #0d0d0c;
      --text-primary:  #1a1a18;
      --text-secondary:#525248;
      --text-muted:    #8a8a80;

      /* Results */
      --win:    #1a6b3c;
      --win-bg: rgba(26,107,60,0.09);
      --draw:   #4b5563;
      --draw-bg:rgba(75,85,99,0.09);
      --loss:   #991b1b;
      --loss-bg:rgba(153,27,27,0.09);

      /* Type */
      --font-display:   'Playfair Display', Georgia, serif;
      --font-condensed: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --font-body:      'DM Sans', system-ui, sans-serif;
      --font-mono:      'JetBrains Mono', 'Courier New', monospace;

      /* Radii */
      --r-sm: 4px;
      --r-md: 8px;
      --r-lg: 12px;
    }

    /* =========================================================
       RESET + BASE
       ========================================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: var(--font-body); border: none; background: none; }
    input, select { font-family: var(--font-body); }

    /* =========================================================
       LAYOUT
       ========================================================= */
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* =========================================================
       SITE HEADER / NAV
       ========================================================= */
    #site-header {
      background: var(--navy);
      border-bottom: 3px solid var(--sky);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      height: 52px;
      gap: 0;
    }
    .nav-brand {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      padding-right: 20px;
      border-right: 1px solid rgba(255,255,255,0.12);
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }
    .nav-brand em { color: var(--sky); font-style: normal; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-link {
      color: rgba(255,255,255,0.55);
      font-family: var(--font-condensed);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 7px 12px;
      border-radius: var(--r-sm);
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .nav-link.active { color: var(--sky); background: rgba(108,171,221,0.12); }

    /* =========================================================
       PAGE HEADERS
       ========================================================= */
    .page-hd {
      background: var(--navy);
      border-bottom: 3px solid var(--sky);
      padding: 28px 0 24px;
    }
    .page-hd h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .page-hd .sub {
      font-family: var(--font-condensed);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
    }
    .page-back {
      font-family: var(--font-condensed);
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .page-back:hover { color: rgba(255,255,255,0.8); }

    /* =========================================================
       LOADING / ERROR
       ========================================================= */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      gap: 14px;
    }
    .loading-head {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .loading-track {
      width: 220px;
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: var(--sky);
      border-radius: 3px;
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); width: 50%; }
      50%  { transform: translateX(100%);  width: 70%; }
      100% { transform: translateX(-100%); width: 50%; }
    }
    .loading-detail {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .error-box {
      background: var(--loss-bg);
      border: 1px solid rgba(153,27,27,0.2);
      border-radius: var(--r-md);
      padding: 16px 20px;
      color: var(--loss);
      font-weight: 600;
      font-size: 0.9rem;
      margin: 28px 0;
    }
    .error-box small {
      display: block;
      margin-top: 4px;
      font-weight: 400;
      opacity: 0.75;
    }

    /* =========================================================
       BADGES
       ========================================================= */
    .badge {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-condensed);
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .badge-w  { background: var(--win-bg);  color: var(--win); }
    .badge-d  { background: var(--draw-bg); color: var(--draw); }
    .badge-l  { background: var(--loss-bg); color: var(--loss); }
    .badge-h  { background: var(--sky-surface); color: var(--sky-deep); }
    .badge-a  { background: var(--navy-surface); color: var(--navy); }
    .badge-n  { background: rgba(0,0,0,0.05); color: var(--text-secondary); }
    .badge-aet   { background: rgba(0,0,0,0.05); color: var(--text-secondary); }
    .badge-pens-w{ background: var(--win-bg);  color: var(--win); }
    .badge-pens-l{ background: var(--loss-bg); color: var(--loss); }
    .badge-fr    { background: rgba(80,80,80,0.07); color: var(--text-secondary); }

    /* =========================================================
       COMPETITION PILLS
       ========================================================= */
    .cpill {
      display: inline-block;
      font-family: var(--font-condensed);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .cpill-wsl    { background: rgba(108,171,221,0.14); color: var(--sky-deep); }
    .cpill-fac    { background: var(--maroon-surface); color: var(--maroon); }
    .cpill-lc     { background: rgba(26,45,74,0.10); color: var(--navy); }
    .cpill-uwcl   { background: rgba(20,50,110,0.10); color: #1a3264; }
    .cpill-shield { background: rgba(120,100,30,0.10); color: #7b6220; }
    .cpill-fr     { background: rgba(80,80,80,0.07); color: var(--text-muted); }

    /* =========================================================
       ON THIS DAY BANNER
       ========================================================= */
    .otd-banner {
      background: var(--surface);
      border-left: 3px solid var(--maroon);
      border-bottom: 1px solid var(--border);
    }
    .otd-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      cursor: pointer;
      user-select: none;
    }
    .otd-head:hover { background: var(--surface-alt); }
    .otd-kicker {
      font-family: var(--font-condensed);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--maroon);
    }
    .otd-title { font-size: 0.86rem; color: var(--text-secondary); flex: 1; }
    .otd-chevron {
      font-size: 0.72em;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .otd-banner.open .otd-chevron { transform: rotate(180deg); }
    .otd-body { display: none; padding: 0 24px 14px; }
    .otd-banner.open .otd-body { display: block; }
    .otd-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-sm);
      margin-bottom: 5px;
      cursor: pointer;
      transition: background 0.12s;
      font-size: 0.84rem;
    }
    .otd-row:hover { background: var(--sky-surface); }
    .otd-yr {
      font-family: var(--font-condensed);
      font-weight: 700;
      font-size: 0.9em;
      color: var(--sky-deep);
      min-width: 34px;
    }

    /* =========================================================
       CONTROLS BAR (match list filters)
       ========================================================= */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    .controls-inner { display: flex; flex-direction: column; gap: 10px; }
    .search-wrap { position: relative; }
    .search-input {
      width: 100%;
      padding: 9px 40px 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      font-size: 0.88rem;
      background: var(--bg);
      color: var(--text-primary);
      transition: border-color 0.15s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--sky);
      background: var(--surface);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: none;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s;
    }
    .search-clear:hover { color: var(--text-primary); background: var(--border-subtle); }
    .search-clear.vis { display: flex; }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fl {
      font-family: var(--font-condensed);
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .filter-select {
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      background: var(--bg);
      color: var(--text-primary);
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--sky); }
    .fbtn {
      padding: 6px 13px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--font-condensed);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--bg);
      color: var(--text-secondary);
      transition: all 0.13s;
    }
    .fbtn:hover { border-color: var(--text-muted); color: var(--text-primary); }
    .fbtn.on-w { background: var(--win-bg);  color: var(--win);  border-color: rgba(26,107,60,0.25); }
    .fbtn.on-d { background: var(--draw-bg); color: var(--draw); border-color: rgba(75,85,99,0.25); }
    .fbtn.on-l { background: var(--loss-bg); color: var(--loss); border-color: rgba(153,27,27,0.25); }
    .fbtn.on   { background: var(--sky-surface); color: var(--sky-deep); border-color: var(--sky-border); }
    .clear-btn {
      padding: 6px 13px;
      border: 1.5px solid rgba(153,27,27,0.25);
      border-radius: var(--r-sm);
      font-family: var(--font-condensed);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--loss);
      background: none;
      transition: background 0.13s;
      display: none;
    }
    .clear-btn:hover { background: var(--loss-bg); }
    .clear-btn.vis { display: inline-flex; }

    /* =========================================================
       STATS BAR
       ========================================================= */
    .stats-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .stats-row {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stats-row::-webkit-scrollbar { display: none; }
    .stat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 7px 18px;
      border-right: 1px solid var(--border-subtle);
      min-width: 56px;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-lbl {
      font-family: var(--font-condensed);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .stat-val {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-top: 2px;
    }
    .stat-val.pos { color: var(--win); }
    .stat-val.neg { color: var(--loss); }

    /* =========================================================
       MATCH LIST
       ========================================================= */
    .list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .list-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .sort-btn {
      font-family: var(--font-condensed);
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      transition: all 0.13s;
    }
    .sort-btn:hover { border-color: var(--sky); color: var(--sky-deep); }

    .match-list {
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    /* Season divider row */
    .season-div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: var(--sky-surface);
      border-bottom: 1px solid var(--sky-border);
      font-family: var(--font-condensed);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sky-deep);
      cursor: pointer;
      transition: background 0.13s;
    }
    .season-div:hover { background: rgba(108,171,221,0.14); }
    .season-div .sd-right { opacity: 0.6; font-weight: 500; }

    /* Match row — <a> tag */
    a.mrow {
      display: grid;
      grid-template-columns: 86px 42px 1fr auto 56px;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      color: inherit;
      transition: background 0.1s;
    }
    a.mrow:last-child { border-bottom: none; }
    a.mrow:hover { background: var(--sky-surface); }
    .mdate {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .mteams {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .mhome, .maway {
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 148px;
    }
    .mhome { font-weight: 600; color: var(--text-bright); }
    .maway { color: var(--text-secondary); }
    .mscore {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      white-space: nowrap;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .ms-w { background: var(--win-bg);  color: var(--win); }
    .ms-d { background: var(--draw-bg); color: var(--draw); }
    .ms-l { background: var(--loss-bg); color: var(--loss); }
    .ms-p { background: rgba(0,0,0,0.05); color: var(--text-muted); }
    .mcomp { text-align: right; }
    .mround {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
      white-space: nowrap;
    }
    .matt {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }

    .show-more {
      display: block;
      width: 100%;
      padding: 13px;
      text-align: center;
      font-family: var(--font-condensed);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sky-deep);
      background: var(--surface);
      border: none;
      border-top: 1px solid var(--border);
      margin-top: 0;
      transition: background 0.13s;
    }
    .show-more:hover { background: var(--sky-surface); }

    /* =========================================================
       MATCH DETAIL PAGE
       ========================================================= */
    .match-hd {
      background: var(--navy);
      border-bottom: 3px solid var(--sky);
      padding-bottom: 24px;
    }
    .match-comp-line {
      font-family: var(--font-condensed);
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 14px;
    }
    .match-scoreline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .msl-team {
      flex: 1;
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 2.5vw, 1.7rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .msl-team.away { text-align: right; color: rgba(255,255,255,0.7); }
    .msl-score {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      white-space: nowrap;
      padding: 6px 18px;
      border-radius: var(--r-md);
      flex-shrink: 0;
      min-width: 110px;
      text-align: center;
    }
    .msl-w { background: var(--win-bg);  color: #72e4a4; }
    .msl-d { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    .msl-l { background: var(--loss-bg); color: #ff8585; }
    .msl-p { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.7); }

    .match-badges { display: flex; align-items: center; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
    .match-meta   { display: flex; flex-wrap: wrap; gap: 5px 14px; }
    .mmeta {
      font-family: var(--font-condensed);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.03em;
    }
    .mmeta strong { color: rgba(255,255,255,0.82); font-weight: 600; }

    /* Detail sections */
    .det-section {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .det-head {
      font-family: var(--font-condensed);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 12px 24px 0;
    }
    .det-body { padding: 10px 24px 18px; }

    /* Tie context */
    .tie-box {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--navy-surface);
      border: 1px solid rgba(26,45,74,0.15);
      border-radius: var(--r-md);
      padding: 11px 16px;
      margin-bottom: 2px;
    }
    .tie-lbl {
      font-family: var(--font-condensed);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;

</head>
<body>

<header id="site-header">
  <div class="wrap nav-inner">
    <div class="nav-brand">Man City <em>Women</em> Archive</div>
    <nav class="nav-links" id="nav">
      <a class="nav-link" href="#"           data-r="">Home</a>
      <a class="nav-link" href="#matches"    data-r="matches">Matches</a>
      <a class="nav-link" href="#players"    data-r="players">Players</a>
      <a class="nav-link" href="#opponents"  data-r="opponents">Opponents</a>
      <a class="nav-link" href="#venues"     data-r="venues">Venues</a>
      <a class="nav-link" href="#records"    data-r="records">Records</a>
    </nav>
  </div>
</header>

<main id="view"></main>

<script>
/* ============================================================
   CONFIG
   ============================================================
   1. Upload mancity-women-archive.xlsx to Google Drive.
   2. Open as Google Sheets → File → Save as Google Sheets.
   3. Share → Anyone with link can view.
   4. Copy the Spreadsheet ID from the URL:
      https://docs.google.com/spreadsheets/d/[SPREADSHEET_ID]/edit
   5. Paste it below.
   ============================================================ */
const SPREADSHEET_ID = '1NHWJYul_XzNK33__oF_TFgT_ccsGMsi3W4i-nadUjhw';

function sheetCSV(name) {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
}

const SHEET_URLS = {
  Matches:      sheetCSV('Matches'),
  Goals:        sheetCSV('Goals'),
  Events:       sheetCSV('Events'),
  Players:      sheetCSV('Players'),
  Opponents:    sheetCSV('Opponents'),
  Competitions: sheetCSV('Competitions'),
  Venues:       sheetCSV('Venues'),
  Managers:     sheetCSV('Managers'),
  Seasons:      sheetCSV('Seasons'),
};

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const DB = {
  matches:        [],   // sorted desc by SeasonOrder, then date
  matchMap:       new Map(),
  goalsByMatch:   new Map(),
  eventsByMatch:  new Map(),
  playerMap:      new Map(),
  playerBySlug:   new Map(),
  opponentMap:    new Map(),
  venueMap:       new Map(),
  competitionMap: new Map(),
  managers:       [],   // sorted by start date asc
  seasonMap:      new Map(),
};

let loaded = false;

// Match list filter + display state
const LS = {
  season: '', competition: '', result: '', ha: '', search: '',
  sort: 'desc', cap: 40,
};

/* ============================================================
   DATA LOADING
   ============================================================ */
function fetchCSV(url) {
  return new Promise((res, rej) =>
    Papa.parse(url, {
      download: true, header: true, skipEmptyLines: true,
      complete: r => res(r.data),
      error: e => rej(e),
    })
  );
}

async function loadData() {
  renderLoading();
  try {
    const [rM, rG, rE, rP, rO, rC, rV, rMgr, rS] = await Promise.all([
      fetchCSV(SHEET_URLS.Matches),
      fetchCSV(SHEET_URLS.Goals),
      fetchCSV(SHEET_URLS.Events),
      fetchCSV(SHEET_URLS.Players),
      fetchCSV(SHEET_URLS.Opponents),
      fetchCSV(SHEET_URLS.Competitions),
      fetchCSV(SHEET_URLS.Venues),
      fetchCSV(SHEET_URLS.Managers),
      fetchCSV(SHEET_URLS.Seasons),
    ]);
    buildDB(rM, rG, rE, rP, rO, rC, rV, rMgr, rS);
    loaded = true;
    route();
  } catch (err) {
    document.getElementById('view').innerHTML =
      `<div class="wrap"><div class="error-box">
        Failed to load archive data. Check the Spreadsheet ID and confirm the sheet is publicly viewable.
        <small>${esc(String(err.message || err))}</small>
      </div></div>`;
  }
}

function buildDB(rM, rG, rE, rP, rO, rC, rV, rMgr, rS) {
  // Seasons
  rS.forEach(s => DB.seasonMap.set(s.Season, { ...s, order: parseInt(s.SeasonOrder) || 0 }));

  // Competitions
  rC.forEach(c => DB.competitionMap.set(c.Name, { ...c, sort: parseInt(c.SortOrder) || 99 }));

  // Matches — decorate with computed fields, then sort
  DB.matches = rM.map(m => ({
    ...m,
    _gf:     safeInt(m['Goals For']),
    _ga:     safeInt(m['Goals Against']),
    _result: computeResult(m),
    _date:   m.Date ? new Date(m.Date) : null,
    _sOrder: (DB.seasonMap.get(m.Season) || {}).order || 0,
  }));

  DB.matches.sort((a, b) => {
    if (b._sOrder !== a._sOrder) return b._sOrder - a._sOrder;
    if (a._date && b._date) return b._date - a._date;
    return 0;
  });

  DB.matches.forEach(m => DB.matchMap.set(m.MatchID, m));

  // Goals + Events indexed by MatchID
  rG.forEach(g => {
    if (!g.MatchID) return;
    if (!DB.goalsByMatch.has(g.MatchID)) DB.goalsByMatch.set(g.MatchID, []);
    DB.goalsByMatch.get(g.MatchID).push(g);
  });
  rE.forEach(e => {
    if (!e.MatchID) return;
    if (!DB.eventsByMatch.has(e.MatchID)) DB.eventsByMatch.set(e.MatchID, []);
    DB.eventsByMatch.get(e.MatchID).push(e);
  });

  // Players
  rP.forEach(p => {
    DB.playerMap.set(p.Name, p);
    if (p.Slug) DB.playerBySlug.set(p.Slug, p);
  });

  // Opponents, Venues
  rO.forEach(o => DB.opponentMap.set(o.Name, o));
  rV.forEach(v => DB.venueMap.set(v.Name, v));

  // Managers — sort by StartDate asc for sequential lookup
  DB.managers = rMgr.map(m => ({
    ...m,
    _start: m.StartDate ? new Date(m.StartDate) : null,
    _end:   m.EndDate   ? new Date(m.EndDate)   : null,
  })).sort((a, b) => (a._start||0) - (b._start||0));
}

/* ============================================================
   HELPERS
   ============================================================ */
function safeInt(v) { const n = parseInt(v); return isNaN(n) ? null : n; }

function computeResult(m) {
  const gf = safeInt(m['Goals For']), ga = safeInt(m['Goals Against']);
  if (gf === null || ga === null) return null;
  return gf > ga ? 'W' : gf < ga ? 'L' : 'D';
}

function getManager(date) {
  if (!date) return null;
  const d = date instanceof Date ? date : new Date(date);
  return DB.managers.find(m =>
    m._start && d >= m._start && (!m._end || d <= m._end)
  ) || null;
}

function isFriendly(m) { return m.Competition === 'Friendly'; }

// Scoreline from home perspective (home team | score | away team)
function homeTeam(m) { return m['Home/Away'] === 'A' ? m.Opposition : 'Man City Women'; }
function awayTeam(m) { return m['Home/Away'] === 'A' ? 'Man City Women' : m.Opposition; }
function homeScore(m) { return m['Home/Away'] === 'A' ? m._ga : m._gf; }
function awayScore(m) { return m['Home/Away'] === 'A' ? m._gf : m._ga; }

function scoreClass(result) {
  return result === 'W' ? 'ms-w' : result === 'L' ? 'ms-l' : result === 'D' ? 'ms-d' : 'ms-p';
}
function mslClass(result) {
  return result === 'W' ? 'msl-w' : result === 'L' ? 'msl-l' : result === 'D' ? 'msl-d' : 'msl-p';
}

function compShort(name) {
  return {
    "Women's Super League":       'WSL',
    "Women's FA Cup":             'FA Cup',
    "Women's League Cup":         'League Cup',
    "UEFA Women's Champions League": 'UWCL',
    "Women's FA Community Shield": 'Shield',
    'Friendly':                   'Friendly',
  }[name] || name;
}
function compPillClass(name) {
  if (!name) return 'cpill-fr';
  if (name.includes('Super League'))     return 'cpill-wsl';
  if (name.includes('FA Cup'))           return 'cpill-fac';
  if (name.includes('League Cup'))       return 'cpill-lc';
  if (name.includes('Champions League')) return 'cpill-uwcl';
  if (name.includes('Shield'))           return 'cpill-shield';
  return 'cpill-fr';
}

function haBadge(ha) {
  if (ha === 'H') return '<span class="badge badge-h">Home</span>';
  if (ha === 'A') return '<span class="badge badge-a">Away</span>';
  return '<span class="badge badge-n">Neut</span>';
}
function resBadge(r) {
  if (r === 'W') return '<span class="badge badge-w">Win</span>';
  if (r === 'D') return '<span class="badge badge-d">Draw</span>';
  if (r === 'L') return '<span class="badge badge-l">Loss</span>';
  return '';
}

function parseMin(v) {
  if (!v) return 999;
  const s = String(v).trim();
  const m = s.match(/^(\d+)\+(\d+)$/);
  return m ? parseInt(m[1]) + parseInt(m[2]) * 0.01 : parseFloat(s) || 999;
}

function fmtDate(d, compact) {
  if (!d) return '';
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return '';
  const day = dt.getDate();
  const mon = compact
    ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]
    : ['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getMonth()];
  const yr = dt.getFullYear();
  return compact ? `${day} ${mon} '${String(yr).slice(2)}` : `${day} ${mon} ${yr}`;
}

function fmtAtt(v) {
  const n = parseInt(v);
  return isNaN(n) ? '' : n.toLocaleString('en-GB');
}

function computeAggregate(m) {
  if (!m.TieID) return null;
  const legs = DB.matches.filter(x => x.TieID === m.TieID);
  if (legs.length < 2) return null;
  const gf = legs.reduce((s, x) => s + (x._gf || 0), 0);
  const ga = legs.reduce((s, x) => s + (x._ga || 0), 0);
  return `${gf}–${ga}`;
}

function topScorers(season, limit) {
  const ids = new Set(DB.matches.filter(m => m.Season === season).map(m => m.MatchID));
  const counts = new Map();
  DB.goalsByMatch.forEach((goals, id) => {
    if (!ids.has(id)) return;
    goals.filter(g => g['For/Against'] === 'For' && g.OG !== 'Y').forEach(g => {
      if (g.Scorer) counts.set(g.Scorer, (counts.get(g.Scorer) || 0) + 1);
    });
  });
  return [...counts.entries()].sort((a,b) => b[1]-a[1]).slice(0, limit||8).map(([n,g]) => ({n,g}));
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function nav(hash) { location.hash = hash; }

/* ============================================================
   ROUTER
   ============================================================ */
function route() {
  if (!loaded) return;
  const hash = decodeURIComponent(location.hash.slice(1)) || '';
  const parts = hash.split('/').filter(Boolean);
  const page  = parts[0] || '';

  document.querySelectorAll('#nav .nav-link').forEach(el =>
    el.classList.toggle('active', el.dataset.r === page)
  );

  switch (page) {
    case 'matches':   return renderMatches();
    case 'match':     return renderMatch(parts[1]);
    case 'season':    return renderSeason(parts[1]);
    case 'players':   return renderPlayers();
    case 'player':    return renderPlayer(parts[1]);
    case 'opponents': return renderOpponents();
    case 'opponent':  return renderOpponent(parts.slice(1).join('/'));
    case 'venues':    return renderVenues();
    case 'records':   return renderRecords();
    default:          return renderHome();
  }
}

window.addEventListener('hashchange', route);

/* ============================================================
   LOADING
   ============================================================ */
function renderLoading() {
  document.getElementById('view').innerHTML =
    `<div class="loading-screen">
       <div class="loading-head">Loading archive…</div>
       <div class="loading-track"><div class="loading-bar"></div></div>
       <div class="loading-detail">Fetching 9 data sources in parallel</div>
     </div>`;
}

/* ============================================================
   ON THIS DAY
   ============================================================ */
function otdBanner() {
  const today = new Date();
  const md = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const hits = DB.matches.filter(m => {
    if (!m._date) return false;
    const d = m._date;
    return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` === md;
  });
  if (!hits.length) return '';
  const dayLabel = today.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
  const rows = hits.map(m => {
    const hs = homeScore(m), as_ = awayScore(m);
    const score = (m._result && hs !== null) ? `${hs}–${as_}` : '–';
    return `<div class="otd-row" onclick="nav('#match/${esc(m.MatchID)}')">
      <span class="otd-yr">${m._date ? m._date.getFullYear() : ''}</span>
      ${resBadge(m._result)}
      <span style="font-family:var(--font-mono);font-weight:600;">${score}</span>
      <span style="flex:1;color:var(--text-secondary);">${esc(homeTeam(m))} v ${esc(awayTeam(m))}</span>
      <span class="cpill ${compPillClass(m.Competition)}">${esc(compShort(m.Competition))}</span>
    </div>`;
  }).join('');
  return `<div class="otd-banner" id="otd">
    <div class="otd-head" onclick="document.getElementById('otd').classList.toggle('open')">
      <span class="otd-kicker">On this day</span>
      <span class="otd-title">${dayLabel} — ${hits.length} match${hits.length>1?'es':''} in history</span>
      <span class="otd-chevron">▾</span>
    </div>
    <div class="otd-body">${rows}</div>
  </div>`;
}

/* ============================================================
   HOME
   ============================================================ */
function renderHome() {
  const latest = [...DB.seasonMap.values()].sort((a,b)=>b.order-a.order)[0];
  const curSeason = latest ? latest.Season : null;
  const curM  = curSeason ? DB.matches.filter(m => m.Season === curSeason) : [];
  const valid = curM.filter(m => m._result);
  const w = valid.filter(m => m._result==='W').length;
  const d = valid.filter(m => m._result==='D').length;
  const l = valid.filter(m => m._result==='L').length;
  const gf = valid.reduce((s,m)=>s+(m._gf||0),0);
  const ga = valid.reduce((s,m)=>s+(m._ga||0),0);
  const form = valid.slice(0,6).reverse()
    .map(m=>`<div class="form-pip fp-${m._result.toLowerCase()}">${m._result}</div>`).join('');
  const recent = valid.slice(0,5).map(m=>matchRowHtml(m)).join('');
  const scorers = topScorers(curSeason, 5);
  const scorerHtml = scorers.length
    ? scorers.map((s,i)=>`<div style="display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-subtle);font-size:0.84rem;">
        <span style="font-family:var(--font-mono);color:var(--text-muted);min-width:20px;">${i+1}</span>
        <span style="flex:1;">${esc(s.n)}</span>
        <span style="font-family:var(--font-mono);font-weight:600;color:var(--sky-deep);">${s.g}</span>
      </div>`).join('')
    : '<div class="no-data">No goal data available.</div>';

  const allValid = DB.matches.filter(m=>m._result&&!isFriendly(m));
  const allW = allValid.filter(m=>m._result==='W').length;
  const seasons = [...DB.seasonMap.values()].sort((a,b)=>b.order-a.order);

  document.getElementById('view').innerHTML = `
    ${otdBanner()}
    <div class="page-hd">
      <div class="wrap">
        <div class="sub">WSL era · 2014 – present</div>
        <h1>Manchester City Women<br>Match Archive</h1>
      </div>
    </div>
    <div class="wrap">
      <div class="home-grid">

        <div>
          ${curSeason ? `
            <div style="margin-top:4px;">
              <div class="home-sec-hd">${esc(curSeason)} season</div>
              <div class="form-row">
                <span class="form-lbl">Form</span>${form}
              </div>
              <div class="season-stats">
                <div class="ss-box"><div class="ss-lbl">Played</div><div class="ss-val">${valid.length}</div></div>
                <div class="ss-box"><div class="ss-lbl">Wins</div><div class="ss-val">${w}</div></div>
                <div class="ss-box"><div class="ss-lbl">Goals</div><div class="ss-val" style="font-size:0.9rem;">${gf}–${ga}</div></div>
                <div class="ss-box"><div class="ss-lbl">Win %</div><div class="ss-val">${valid.length?Math.round(w/valid.length*100):0}%</div></div>
              </div>

              <div class="home-sec-hd">Top scorers — ${esc(curSeason)}</div>
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:4px 12px 4px;margin-bottom:20px;">
                ${scorerHtml}
              </div>

              <div class="home-sec-hd">Recent results</div>
              <div class="match-list" style="margin-top:2px;">
                ${recent || '<div style="padding:16px;color:var(--text-muted);font-size:0.85rem;">No results yet.</div>'}
              </div>
              <a class="view-all-link" href="#matches">All matches →</a>
            </div>
          ` : '<div class="stub"><p>No season data found. Check configuration.</p></div>'}
        </div>

        <div style="margin-top:4px;">
          <div class="home-sec-hd">All-time record</div>
          <div class="season-stats" style="margin-bottom:24px;grid-template-columns:repeat(2,1fr);">
            <div class="ss-box"><div class="ss-lbl">Matches</div><div class="ss-val">${allValid.length}</div></div>
            <div class="ss-box"><div class="ss-lbl">Wins</div><div class="ss-val">${allW}</div></div>
            <div class="ss-box"><div class="ss-lbl">W%</div><div class="ss-val">${allValid.length?Math.round(allW/allValid.length*100):0}%</div></div>
            <div class="ss-box"><div class="ss-lbl">Players</div><div class="ss-val">${DB.playerMap.size}</div></div>
          </div>

          <div class="home-sec-hd">Seasons</div>
          <div class="side-card" style="margin-top:2px;">
            <div class="side-card-hd">All seasons</div>
            <div class="seasons-list">
              ${seasons.map(s => {
                const sm = DB.matches.filter(x=>x.Season===s.Season&&x._result&&!isFriendly(x));
                const sw = sm.filter(x=>x._result==='W').length;
                return `<a href="#season/${encodeURIComponent(s.Season)}">
                  <span style="font-weight:600;">${esc(s.Season)}</span>
                  <span class="sv">${sm.length}P ${sw}W</span>
                </a>`;
              }).join('')}
            </div>
          </div>
        </div>

      </div>
    </div>`;
}

/* ============================================================
   MATCH LIST
   ============================================================ */
function renderMatches(patch) {
  if (patch) Object.assign(LS, patch);

  const filtered = filterMatches();
  const totals   = calcTotals(filtered);
  const shown    = filtered.slice(0, LS.cap);
  const hasFilter = !!(LS.season||LS.competition||LS.result||LS.ha||LS.search);

  // Sort competitions by their SortOrder
  const comps = [...DB.competitionMap.values()]
    .sort((a,b) => a.sort - b.sort).map(c => c.Name);
  const seasons = [...DB.seasonMap.values()]
    .sort((a,b) => b.order - a.order).map(s => s.Season);

  const listHtml = (!hasFilter && LS.sort === 'desc')
    ? buildGroupedList(shown)
    : shown.map(m => matchRowHtml(m)).join('');

  const header = LS.season
    ? `<h1>${esc(LS.season)}</h1><div class="sub">${filtered.length} matches</div>`
    : `<h1>All Matches</h1><div class="sub">${DB.matches.length} matches · 2014 – present</div>`;

  document.getElementById('view').innerHTML = `
    <div class="page-hd"><div class="wrap">${header}</div></div>

    <div class="controls">
      <div class="wrap">
        <div class="controls-inner">
          <div class="search-wrap">
            <input id="si" class="search-input" type="text"
              placeholder="Search opposition, scorer, venue…" value="${esc(LS.search)}">
            <button id="sc" class="search-clear${LS.search?' vis':''}" onclick="clearSearch()">✕</button>
          </div>
          <div class="filter-row">
            <span class="fl">Season</span>
            <select class="filter-select" onchange="applyFilter('season',this.value)">
              <option value="">All</option>
              ${seasons.map(s=>`<option value="${esc(s)}"${LS.season===s?' selected':''}>${esc(s)}</option>`).join('')}
            </select>
            <span class="fl" style="margin-left:4px;">Comp</span>
            <select class="filter-select" onchange="applyFilter('competition',this.value)">
              <option value="">All</option>
              ${comps.map(c=>`<option value="${esc(c)}"${LS.competition===c?' selected':''}>${esc(compShort(c))}</option>`).join('')}
            </select>
          </div>
          <div class="filter-row">
            <span class="fl">Result</span>
            <button class="fbtn${LS.result==='W'?' on-w':''}" onclick="toggleResult('W')">Won</button>
            <button class="fbtn${LS.result==='D'?' on-d':''}" onclick="toggleResult('D')">Drawn</button>
            <button class="fbtn${LS.result==='L'?' on-l':''}" onclick="toggleResult('L')">Lost</button>
            <span class="fl" style="margin-left:6px;">H/A</span>
            <button class="fbtn${LS.ha==='H'?' on':''}" onclick="toggleHA('H')">Home</button>
            <button class="fbtn${LS.ha==='A'?' on':''}" onclick="toggleHA('A')">Away</button>
            <button class="clear-btn${hasFilter?' vis':''}" onclick="clearFilters()">Clear</button>
            <button class="sort-btn" style="margin-left:auto;" onclick="toggleSort()">
              ${LS.sort==='desc'?'↓ Newest':'↑ Oldest'}
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="wrap"><div class="stats-row">${statsBarHtml(totals)}</div></div>
    </div>

    <div class="wrap">
      <div class="list-meta">
        <span class="list-count">${filtered.length} match${filtered.length!==1?'es':''}</span>
      </div>
      <div class="match-list" id="ml">
        ${listHtml || '<div style="padding:24px;text-align:center;color:var(--text-muted);">No matches found.</div>'}
      </div>
      ${filtered.length > LS.cap
        ? `<button class="show-more" onclick="loadMore()">Show more — ${filtered.length - LS.cap} remaining</button>`
        : ''}
    </div>`;

  // Search input listener
  const si = document.getElementById('si');
  if (si) si.addEventListener('input', e => {
    LS.search = e.target.value;
    LS.cap = 40;
    document.getElementById('sc').classList.toggle('vis', !!LS.search);
    renderMatches();
  });
}

function matchRowHtml(m) {
  const ht = homeTeam(m), at = awayTeam(m);
  const hs = homeScore(m), as_ = awayScore(m);
  const scored = m._result !== null && hs !== null;
  const scoreStr = scored ? `${hs}–${as_}` : '–';
  const aet = m.AET === 'Y' ? '<span class="badge badge-aet" style="font-size:0.6rem;margin-left:3px;">AET</span>' : '';

  return `<a class="mrow" href="#match/${esc(m.MatchID)}">
    <span class="mdate">${fmtDate(m._date, true)}</span>
    <span class="mha">${haBadge(m['Home/Away'])}</span>
    <span class="mteams">
      <span class="mhome">${esc(ht)}</span>
      <span class="mscore ${scored ? scoreClass(m._result) : 'ms-p'}">${scoreStr}${aet}</span>
      <span class="maway">${esc(at)}</span>
    </span>
    <span class="mcomp">
      <span class="cpill ${compPillClass(m.Competition)}">${esc(compShort(m.Competition))}</span>
      ${m.Round ? `<div class="mround">${esc(m.Round)}</div>` : ''}
    </span>
    <span class="matt">${fmtAtt(m.Attendance)}</span>
  </a>`;
}

function buildGroupedList(ms) {
  const groups = new Map();
  ms.forEach(m => {
    if (!groups.has(m.Season)) groups.set(m.Season, []);
    groups.get(m.Season).push(m);
  });
  let html = '';
  groups.forEach((list, season) => {
    const wsl = list.filter(m => m.Competition==="Women's Super League" && m._result);
    const w = wsl.filter(m=>m._result==='W').length;
    const d = wsl.filter(m=>m._result==='D').length;
    const l = wsl.filter(m=>m._result==='L').length;
    const wslNote = wsl.length ? ` · WSL ${w}W ${d}D ${l}L` : '';
    html += `<a class="season-div" href="#season/${encodeURIComponent(season)}">
      <span>${esc(season)}${wslNote}</span>
      <span class="sd-right">${list.length} matches →</span>
    </a>`;
    html += list.map(m => matchRowHtml(m)).join('');
  });
  return html;
}

function filterMatches() {
  let r = [...DB.matches];
  if (LS.season)      r = r.filter(m => m.Season === LS.season);
  if (LS.competition) r = r.filter(m => m.Competition === LS.competition);
  if (LS.result)      r = r.filter(m => m._result === LS.result);
  if (LS.ha)          r = r.filter(m => m['Home/Away'] === LS.ha);
  if (LS.search) {
    const t = LS.search.toLowerCase();
    r = r.filter(m => {
      if ((m.Opposition||'').toLowerCase().includes(t)) return true;
      if ((m.Competition||'').toLowerCase().includes(t)) return true;
      if ((m.Season||'').toLowerCase().includes(t)) return true;
      if ((m.Round||'').toLowerCase().includes(t)) return true;
      if ((m.Venue||'').toLowerCase().includes(t)) return true;
      const goals = DB.goalsByMatch.get(m.MatchID) || [];
      return goals.some(g => (g.Scorer||'').toLowerCase().includes(t));
    });
  }
  if (LS.sort === 'asc') r = [...r].reverse();
  return r;
}

function calcTotals(ms) {
  const v = ms.filter(m => m._result && !isFriendly(m));
  const w = v.filter(m=>m._result==='W').length;
  const d = v.filter(m=>m._result==='D').length;
  const l = v.filter(m=>m._result==='L').length;
  const gf = v.reduce((s,m)=>s+(m._gf||0),0);
  const ga = v.reduce((s,m)=>s+(m._ga||0),0);
  return { p:v.length, w, d, l, gf, ga, gd: gf-ga };
}

function statsBarHtml(t) {
  const gd = t.gd;
  const gdStr = (gd>0?'+':'')+gd;
  const gdCls = gd>0?'pos':gd<0?'neg':'';
  return [['P',t.p],['W',t.w],['D',t.d],['L',t.l],['GF',t.gf],['GA',t.ga],
    ['GD',`<span class="${gdCls}">${gdStr}</span>`]]
    .map(([l,v])=>`<div class="stat-cell"><div class="stat-lbl">${l}</div><div class="stat-val">${v}</div></div>`)
    .join('');
}

function applyFilter(key, val) {
  LS[key] = val; LS.cap = 40; renderMatches();
}
function toggleResult(r) { LS.result = LS.result===r?'':r; LS.cap=40; renderMatches(); }
function toggleHA(v)      { LS.ha = LS.ha===v?'':v;         LS.cap=40; renderMatches(); }
function clearFilters()   {
  Object.assign(LS,{season:'',competition:'',result:'',ha:'',search:'',sort:'desc',cap:40});
  renderMatches();
}
function clearSearch()    { LS.search=''; LS.cap=40; renderMatches(); }
function toggleSort()     { LS.sort = LS.sort==='desc'?'asc':'desc'; LS.cap=40; renderMatches(); }
function loadMore()       { LS.cap += 40; renderMatches(); }

/* ============================================================
   SEASON PAGE
   ============================================================ */
function renderSeason(season) {
  if (!season) return renderMatches();
  const s = decodeURIComponent(season);
  const ms = DB.matches.filter(m => m.Season === s);
  if (!ms.length) {
    document.getElementById('view').innerHTML =
      `<div class="wrap"><div class="error-box">Season "${esc(s)}" not found.</div></div>`;
    return;
  }
  // Push season filter state and show as match list
  Object.assign(LS, { season: s, competition:'', result:'', ha:'', search:'', sort:'asc', cap:200 });
  renderMatches();
}

/* ============================================================
   MATCH DETAIL
   ============================================================ */
function renderMatch(id) {
  if (!id) return renderHome();
  const m = DB.matchMap.get(id);
  if (!m) {
    document.getElementById('view').innerHTML =
      `<div class="wrap"><div class="error-box">Match "${esc(id)}" not found.</div></div>`;
    return;
  }

  const goals  = (DB.goalsByMatch.get(id)  || []).slice().sort((a,b)=>parseMin(a.Minute)-parseMin(b.Minute));
  const events = (DB.eventsByMatch.get(id) || []).slice().sort((a,b)=>parseMin(a.Minute)-parseMin(b.Minute));

  const cityIsHome = m['Home/Away'] !== 'A';
  const ht = homeTeam(m), at = awayTeam(m);
  const hs = homeScore(m), as_ = awayScore(m);
  const scored = m._result !== null && hs !== null;
  const scoreStr = scored ? `${hs}–${as_}` : '– –';
  const manager = getManager(m._date);

  // Header badges
  const badges = [];
  if (m._result) badges.push(resBadge(m._result));
  badges.push(haBadge(m['Home/Away']));
  if (m.AET === 'Y') badges.push('<span class="badge badge-aet">AET</span>');
  if (m['Pen Result'] === 'W') badges.push(
    `<span class="badge badge-pens-w">Won pens${m['Pen For']&&m['Pen Against']?' '+m['Pen For']+'–'+m['Pen Against']:''}</span>`);
  if (m['Pen Result'] === 'L') badges.push(
    `<span class="badge badge-pens-l">Lost pens${m['Pen For']&&m['Pen Against']?' '+m['Pen For']+'–'+m['Pen Against']:''}</span>`);
  if (isFriendly(m)) badges.push('<span class="badge badge-fr">Friendly</span>');

  // Meta strip
  const meta = [];
  if (m._date) meta.push(`<span class="mmeta">${fmtDate(m._date, false)}</span>`);
  if (m.Kickoff && !m.Kickoff.startsWith('00:00')) {
    meta.push(`<span class="mmeta">KO <strong>${m.Kickoff.slice(0,5)}</strong></span>`);
  }
  if (m.Venue)      meta.push(`<span class="mmeta">Venue <strong>${esc(m.Venue)}</strong></span>`);
  if (m.Attendance) meta.push(`<span class="mmeta">Att. <strong>${fmtAtt(m.Attendance)}</strong></span>`);
  if (manager)      meta.push(`<span class="mmeta">Manager <strong>${esc(manager.Name)}${manager.Caretaker==='Y'?' (caretaker)':''}</strong></span>`);
  if (m.Referee)    meta.push(`<span class="mmeta">Referee <strong>${esc(m.Referee)}</strong></span>`);

  // Two-legged tie
  let tieHtml = '';
  if (m.TieID) {
    const agg = computeAggregate(m);
    const other = DB.matches.find(x => x.TieID===m.TieID && x.MatchID!==m.MatchID);
    const leg = m.Leg ? ` · Leg ${m.Leg}` : '';
    tieHtml = `<div class="wrap" style="padding-top:12px;">
      <div class="tie-box">
        <span class="tie-lbl">Two-legged tie${esc(leg)}</span>
        ${agg ? `<span class="tie-agg">Agg: ${agg}</span>` : ''}
        ${other ? `<a class="tie-link" href="#match/${esc(other.MatchID)}">Other leg →</a>` : ''}
      </div>
    </div>`;
  }

  // Goals
  const cityGoals = goals.filter(g => g['For/Against']==='For');
  const oppGoals  = goals.filter(g => g['For/Against']==='Against');
  const leftGoals  = cityIsHome ? cityGoals : oppGoals;
  const rightGoals = cityIsHome ? oppGoals  : cityGoals;
  const leftCity   = cityIsHome;

  function goalLineHtml(g) {
    const min  = g.Minute ? `${g.Minute}'` : '?';
    const isOG = g.OG === 'Y', isPen = g.Penalty === 'Y';
    let sc = esc(g.Scorer||'—');
    if (isOG)  sc += ' <span class="og">OG</span>';
    if (isPen) sc += ' <span class="pen">Pen</span>';
    return `<div class="goal-line"><span class="gmin">${min}</span><span class="gscorer">${sc}</span></div>`;
  }

  const goalsSection = (goals.length > 0 || (scored && (m._gf > 0 || m._ga > 0)))
    ? `<div class="goals-cols">
        <div>
          <div class="goals-col-hd${leftCity?' city':''}">${esc(cityIsHome?'Man City Women':m.Opposition)}</div>
          ${leftGoals.length ? leftGoals.map(goalLineHtml).join('') : '<div class="no-data">None</div>'}
        </div>
        <div>
          <div class="goals-col-hd${!leftCity?' city':''}">${esc(cityIsHome?m.Opposition:'Man City Women')}</div>
          ${rightGoals.length ? rightGoals.map(goalLineHtml).join('') : '<div class="no-data">None</div>'}
        </div>
      </div>`
    : '<div class="no-data">Goal data not yet recorded for this match.</div>';

  // Events timeline
  const tlHtml = buildTimeline(m, goals, events, cityIsHome);

  // Notes
  const notesHtml = m.Notes
    ? `<div class="det-section">
        <div class="det-head">Notes</div>
        <div class="det-body"><p style="font-size:0.86rem;color:var(--text-secondary);line-height:1.6;">${esc(m.Notes)}</p></div>
       </div>`
    : '';

  const compLine = [m.Competition, m.Round].filter(Boolean).join(' · ');

  document.getElementById('view').innerHTML = `
    <div class="match-hd">
      <div class="wrap">
        <div class="page-back" onclick="history.length>2?history.back():nav('#matches')">← Back</div>
        <div class="match-comp-line">${esc(compLine)}</div>
        <div class="match-scoreline">
          <div class="msl-team">${esc(ht)}</div>
          <div class="msl-score ${mslClass(m._result)}">${scoreStr}</div>
          <div class="msl-team away">${esc(at)}</div>
        </div>
        <div class="match-badges">${badges.join('')}</div>
        <div class="match-meta">${meta.join('')}</div>
      </div>
    </div>

    ${tieHtml}

    <div class="det-section">
      <div class="det-head">Goals</div>
      <div class="det-body">${goalsSection}</div>
    </div>

    ${events.length||goals.length ? `
    <div class="det-section">
      <div class="det-head">Match events</div>
      <div class="det-body">${tlHtml}</div>
    </div>` : ''}

    ${notesHtml}`;
}

/* ============================================================
   EVENTS TIMELINE
   ============================================================ */
function buildTimeline(m, goals, events, cityIsHome) {
  // Merge goals + events; goals carry their running score implicitly
  const items = [];

  goals.forEach(g => items.push({
    min: parseMin(g.Minute), minStr: g.Minute ? `${g.Minute}'` : '?',
    kind: 'goal',
    side: g['For/Against']==='For' ? 'city' : 'opp',
    player: g.Scorer||'', isOG: g.OG==='Y', isPen: g.Penalty==='Y',
  }));

  events.forEach(e => items.push({
    min: parseMin(e.Minute), minStr: e.Minute ? `${e.Minute}'` : '?',
    kind: e.Type||'Other',
    side: e.Team==='City' ? 'city' : 'opp',
    player: e.Player||'', player2: e.Player2||'', detail: e.Detail||'',
  }));

  items.sort((a,b) => a.min - b.min);
  if (!items.length) return '<div class="no-data">No events recorded.</div>';

  let cGF = 0, cGA = 0, htDone = false, ftDone = false;
  let html = '';

  function runScore() {
    return cityIsHome ? `${cGF}–${cGA}` : `${cGA}–${cGF}`;
  }

  items.forEach(e => {
    if (!htDone && e.min >= 45) {
      htDone = true;
      html += `<div class="tl-row"><div class="tl-marker">Half time — ${runScore()}</div></div>`;
    }
    if (!ftDone && m.AET==='Y' && e.min > 90) {
      ftDone = true;
      html += `<div class="tl-row"><div class="tl-marker">90 minutes — ${runScore()}</div></div>`;
    }

    const cityLeft = cityIsHome ? e.side==='city' : e.side==='opp';

    let left = '', right = '';

    if (e.kind === 'goal') {
      if (e.side==='city') cGF++; else cGA++;
      const sc = runScore();
      const lbl = esc(e.player) + (e.isOG?' <span class="og" style="font-family:var(--font-condensed);font-size:0.68rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">OG</span>':'')
                                 + (e.isPen?' <span style="font-family:var(--font-condensed);font-size:0.68rem;font-weight:700;text-transform:uppercase;color:var(--sky-deep);">Pen</span>':'');
      if (cityLeft)
        left  = `<span class="tl-score">${sc}</span> ${lbl} ⚽`;
      else
        right = `⚽ ${lbl} <span class="tl-score">${sc}</span>`;

    } else if (e.kind==='YellowCard') {
      if (cityLeft) left  = `${esc(e.player)} 🟨`;
      else          right = `🟨 ${esc(e.player)}`;

    } else if (e.kind==='RedCard'||e.kind==='SecondYellow') {
      const ic = e.kind==='SecondYellow' ? '🟨🟥' : '🟥';
      if (cityLeft) left  = `${esc(e.player)} ${ic}`;
      else          right = `${ic} ${esc(e.player)}`;

    } else if (e.kind==='Sub') {
      const txt = e.player2
        ? `<span style="color:var(--win);">↑</span>${esc(e.player2)} <span style="color:var(--loss);">↓</span>${esc(e.player)}`
        : `↔ ${esc(e.player)}`;
      if (cityLeft) left  = `<span style="color:var(--text-muted);font-size:0.8rem;">${txt}</span>`;
      else          right = `<span style="color:var(--text-muted);font-size:0.8rem;">${txt}</span>`;

    } else if (e.kind==='MissedPen') {
      if (cityLeft) left  = `<span style="color:var(--text-muted);">${esc(e.player)} missed pen ✕</span>`;
      else          right = `<span style="color:var(--text-muted);">✕ ${esc(e.player)} missed pen</span>`;

    } else if (['PenShootoutScore','PenShootoutMiss','PenShootoutSave'].includes(e.kind)) {
      const scored_ = e.kind==='PenShootoutScore';
      const col = scored_ ? 'var(--win)' : 'var(--loss)';
      const ic  = scored_ ? '✓' : '✕';
      const lbl2 = e.kind==='PenShootoutSave'
        ? `${esc(e.player)} saved` : `${esc(e.player)} ${scored_?'scored':'missed'}`;
      if (cityLeft) left  = `<span style="color:${col};">${lbl2} ${ic}</span>`;
      else          right = `<span style="color:${col};">${ic} ${lbl2}</span>`;

    } else {
      const txt2 = e.detail ? `${esc(e.player)}: ${esc(e.detail)}` : esc(e.player);
      if (cityLeft) left  = `<span style="color:var(--text-muted);font-size:0.8rem;">${txt2}</span>`;
      else          right = `<span style="color:var(--text-muted);font-size:0.8rem;">${txt2}</span>`;
    }

    const isPS = ['PenShootoutScore','PenShootoutMiss','PenShootoutSave'].includes(e.kind);
    html += `<div class="tl-row">
      <div class="tl-city" style="${!cityIsHome&&e.kind==='goal'?'text-align:left;':''}">${left}</div>
      <div class="tl-min" style="${isPS?'font-size:0.62rem;':''}">${isPS?'Pens':e.minStr}</div>
      <div class="tl-opp" style="${cityIsHome&&e.kind==='goal'?'text-align:right;':''}">${right}</div>
    </div>`;
  });

  // Final score
  if (m._result && m._gf !== null) {
    const ft = m.AET==='Y' ? 'AET' : 'FT';
    const col = m._result==='W'?'var(--win)':m._result==='L'?'var(--loss)':'var(--text-muted)';
    const finalScore = runScore();
    html += `<div class="tl-row" style="background:var(--surface-alt);border-radius:3px;">
      <div></div>
      <div class="tl-min" style="color:${col};font-weight:700;">${ft}</div>
      <div class="tl-opp"><span class="tl-score" style="color:${col};font-weight:700;">${finalScore}</span></div>
    </div>`;
  }

  return html;
}
